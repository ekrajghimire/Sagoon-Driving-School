# Manual backup for the scheduled jobs (reminders, review requests, calendar retries).
# The every-15-minutes schedule runs on cron-job.org instead (free) — see
# docs/SETUP_AND_DEPLOYMENT.md step 7. Use "Run workflow" in the Actions tab to trigger once.
# Needs repo secrets SITE_URL (https://…, no trailing slash) and CRON_SECRET.
name: Scheduled jobs (manual)
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run reminders and calendar sync
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron"
